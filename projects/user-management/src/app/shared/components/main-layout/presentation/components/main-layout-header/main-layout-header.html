<!-- BEGIN: MainHeader -->
<header class="main-header">
  <div class="header-container">
    <!-- Brand Logo & Name -->
    <div class="brand-logo" data-purpose="brand-logo">
      <div class="brand-icon">E</div>
      <span class="brand-name"> ERP SYSTEM </span>
    </div>

    <!-- Quick Header Navigation & Controls -->
    <div class="header-controls">
      <nav class="header-navigation">
        @if (session(); as user) {
          <div>
            <span>Hello, {{ user.firstName }}{{ user.lastName }}!</span>
          </div>
        }
      </nav>
      <nav class="header-navigation">
        <div class="icon-user" (click)="profileSettings()">
          <icon-user size="xs"></icon-user>
        </div>
      </nav>
    </div>
  </div>
</header>
<!-- END: MainHeader -->
