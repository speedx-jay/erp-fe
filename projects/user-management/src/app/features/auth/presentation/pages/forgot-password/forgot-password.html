<!-- BEGIN: MainContent -->

<main class="main-content">
  <!-- Top Warm Yellow Banner Section -->
  <section class="hero-section">
    <div class="hero-content">
      <h1>Forgot your password?</h1>

  <p>Enter your email and we'll send you a link to reset your password</p>
</div>

  </section>

  <!-- Floating Authentication Card -->

  <div class="auth-container" data-purpose="auth-container">
    <div class="auth-card">
      <!-- Forgot Password Form -->
      <form
        class="forgot-password-form"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
      >
        <!-- Email Input Field -->
        <div data-purpose="input-group-email">
          <label class="input-label" for="email">
            EMAIL ADDRESS
          </label>

      <div class="input-wrapper">
        <div class="input-icon">
          <svg
            class="form-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M3 8l9 6 9-6M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            ></path>
          </svg>
        </div>

        <input
          id="email"
          name="email"
          placeholder="you@company.com"
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </div>
    </div>

    <!-- Submit Button -->
    <div class="submit-container">
      <button
        class="sign-in-button"
        type="submit"
        [disabled]="this.isLoading()"
      >
        <span>
          {{ this.isLoading() ? 'Sending...' : 'Send Reset Link' }}
        </span>

        @if (!this.isLoading()) {
          <svg
            class="sign-in-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M14 5l7 7m0 0l-7 7m7-7H3"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
            ></path>
          </svg>
        }
      </button>
    </div>
  </form>

  <!-- Back to Login -->
  <div class="registration-callout" data-purpose="back-to-login">
    <p>
      Remember your password?

      <a routerLink="/auth/login">Back to Sign In</a>
    </p>
  </div>
</div>

  </div>
</main>
<!-- END: MainContent -->
