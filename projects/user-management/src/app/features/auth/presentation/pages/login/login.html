<!-- BEGIN: MainContent -->
<main class="main-content">
  <!-- Top Warm Yellow Banner Section -->
  <section class="hero-section">
    <div class="hero-content">
      <h1>Welcome back</h1>

      <p>Sign in to access your dashboard and workspace</p>
    </div>
  </section>

  <!-- Floating Authentication Card -->
  <div class="auth-container" data-purpose="auth-container">
    <div class="auth-card">
      <!-- Login Form -->
      <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Username / Email Input Field -->
        <div data-purpose="input-group-username">
          <label class="input-label" for="username"> USERNAME OR EMAIL </label>

          <div class="input-wrapper">
            <div class="input-icon">
              <svg class="form-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                ></path>
              </svg>
            </div>

            <input
              id="email"
              name="email"
              placeholder="you@company.com"
              type="email"
              formControlName="email"
            />
          </div>
        </div>

        <!-- Password Input Field -->
        <div data-purpose="input-group-password">
          <div class="password-header">
            <label class="input-label" for="password"> PASSWORD </label>

            <a class="forgot-link" href="#"> Forgot? </a>
          </div>

          <div class="input-wrapper">
            <div class="input-icon">
              <svg class="form-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                ></path>
              </svg>
            </div>

            <input
              id="password"
              name="password"
              placeholder="••••••••••••"
              type="password"
              formControlName="password"
            />

            <!-- Password Eye Toggle -->
            <button
              aria-label="Toggle password visibility"
              class="password-toggle"
              data-purpose="toggle-password-visibility"
              id="togglePassword"
              type="button"
            >
              <svg
                id="eyeIcon"
                class="eye-icon"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                ></path>

                <path
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                ></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="remember-me" data-purpose="remember-me">
          <input id="remember-me" name="remember-me" type="checkbox" />

          <label for="remember-me"> Remember me on this device </label>
        </div>

        <!-- Primary Submit Button -->
        <div class="submit-container">
          <button class="sign-in-button" type="submit">
            <span>Sign In</span>

            <svg class="sign-in-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                d="M14 5l7 7m0 0l-7 7m7-7H3"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
              ></path>
            </svg>
          </button>
        </div>
      </form>

      <!-- Or Continue With Divider -->
      <div class="divider">
        <div class="divider-line"></div>

        <div class="divider-label">
          <span> OR CONTINUE WITH </span>
        </div>
      </div>

      <!-- Social Sign In SSO Grid -->
      <div class="sso-grid" data-purpose="sso-providers">
        <!-- Google SSO -->
        <button class="sso-button" type="button">
          <svg class="sso-icon" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            ></path>

            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            ></path>

            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              fill="#FBBC05"
            ></path>

            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              fill="#EA4335"
            ></path>
          </svg>

          <span>Google</span>
        </button>

        <!-- Apple SSO -->
        <button class="sso-button" type="button">
          <svg class="sso-icon apple-icon" viewBox="0 0 24 24">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.64 1.35-.56.65-1.06 1.7-0.93 2.72 1.02.08 2.05-.48 2.65-1.22z"
            ></path>
          </svg>

          <span>Apple</span>
        </button>
      </div>

      <!-- Registration Callout -->
      <div class="registration-callout" data-purpose="registration-callout">
        <p>
          Don't have an account?

          <a routerLink="/auth/create-account">Create account</a>
        </p>
      </div>
    </div>
  </div>
</main>
<!-- END: MainContent -->
