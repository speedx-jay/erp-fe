<!-- BEGIN: MainContent -->

<main class="main-content">
  <!-- Top Warm Yellow Banner Section -->

  <!-- Floating Authentication Card -->
  <div class="auth-container" data-purpose="auth-container">
    <div class="auth-card">
      <!-- Reset Password Form -->
      <form class="reset-password-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- New Password -->
        <div data-purpose="input-group-password">
          <label class="input-label" for="password"> NEW PASSWORD </label>

          <div class="input-wrapper">
            <div class="input-icon">
              <svg class="form-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  d="M16 11V7a4 4 0 00-8 0v4M5 11h14a2 2 0 012 2v7a2 2 0 01-2 2H5a2 2 0 01-2-2v-7a2 2 0 012-2z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                ></path>
              </svg>
            </div>

            <input
              id="password"
              name="password"
              placeholder="Enter your new password"
              type="password"
              formControlName="newPassword"
              autocomplete="new-password"
            />
          </div>
        </div>

        <!-- Confirm Password -->
        <div data-purpose="input-group-confirm-password">
          <label class="input-label" for="confirmPassword"> CONFIRM PASSWORD </label>

          <div class="input-wrapper">
            <div class="input-icon">
              <svg class="form-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  d="M16 11V7a4 4 0 00-8 0v4M5 11h14a2 2 0 012 2v7a2 2 0 01-2 2H5a2 2 0 01-2-2v-7a2 2 0 012-2z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                ></path>
              </svg>
            </div>

            <input
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your new password"
              type="password"
              formControlName="confirmPassword"
              autocomplete="new-password"
            />
          </div>
        </div>
        @if (form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched) {
          <p class="password-error">Passwords do not match.</p>
        }
        <!-- Password Requirements -->
        <div class="password-hint">
          <p>Password must be at least 3 characters.</p>
        </div>

        <!-- Submit Button -->
        <div class="submit-container">
          <button class="sign-in-button" type="submit" [disabled]="isLoading() || form.invalid">
            <span>
              {{ isLoading() ? 'Resetting...' : 'Reset Password' }}
            </span>

            @if (!isLoading()) {
              <svg class="sign-in-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  d="M14 5l7 7m0 0l-7 7m7-7H3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                ></path>
              </svg>
            }
          </button>
        </div>
      </form>

      <!-- Back to Login -->
      <div class="registration-callout" data-purpose="back-to-login">
        <p>
          Remember your password?

          <a routerLink="/auth/login">Back to Sign In</a>
        </p>
      </div>
    </div>
  </div>
</main>

<!-- END: MainContent -->
